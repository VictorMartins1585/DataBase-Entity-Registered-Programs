<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - CPR</title>

    <!-- Fontes Oficiais do Sistema -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Tokens de Design importados do base.html */
        :root {
            --brand-primary: #1F5C4F;
            --brand-primary-dark: #164A40;
            --brand-accent: #C98A3E;
            --brand-bg: #F5F6F4;
            --brand-surface: #FFFFFF;
            --brand-border: #E1E4E1;
            --brand-ink: #16211F;
            --brand-muted: #5B6663;
        }

        body {
            background-color: var(--brand-bg);
            color: var(--brand-ink);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        h3 {
            font-family: 'Manrope', 'Inter', sans-serif;
        }

        /* Faixa Institucional no topo da tela */
        .faixa-topo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, var(--brand-primary) 0%, var(--brand-accent) 100%);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            background-color: var(--brand-surface);
            border: 1px solid var(--brand-border) !important;
            box-shadow: 0 4px 24px rgba(22, 33, 31, 0.08);
        }

        .text-brand-primary {
            color: var(--brand-primary) !important;
        }

        /* Substituição do azul do Bootstrap pelo verde do sistema */
        .btn-primary {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
        }

            .btn-primary:hover, .btn-primary:focus {
                background-color: var(--brand-primary-dark);
                border-color: var(--brand-primary-dark);
            }

        .input-group-text, .form-control {
            border-color: var(--brand-border);
        }

            .form-control:focus {
                border-color: var(--brand-primary);
                box-shadow: 0 0 0 .25rem rgba(31, 92, 79, .25);
            }
    </style>
</head>
<body>

    <div class="faixa-topo"></div>

    <div class="card login-card border-0">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h3 class="text-brand-primary fw-bold"><i class="fa-solid fa-shield-halved"></i> CPR DB</h3>
                <p class="text-muted" style="color: var(--brand-muted) !important;">Acesso restrito ao banco de dados</p>
            </div>

            {% if erro %}
            <div class="alert alert-danger shadow-sm text-center" role="alert">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ erro }}
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-4">
                    <label class="form-label fw-bold">Senha de Acesso</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="fa-solid fa-lock text-muted"></i>
                        </span>
                        <input type="password" name="senha" class="form-control border-start-0" placeholder="Digite a senha" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

</body>
</html>
